# =========================================================
# ELMS - CENTRALIZED COMMON CONFIGURATION
# =========================================================


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elms_database}?useSSL=${DB_SSL:false}&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1


# =========================================================
# EUREKA CLIENT
# =========================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:100}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.repositories.enabled=false
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}

spring.cache.type=${CACHE_TYPE:redis}


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}


# =========================================================
# LEARNING MANAGEMENT JWT
# =========================================================

app.jwt.secret=${ENROLLMENT_JWT_SECRET}
app.jwt.expiration-ms=${ENROLLMENT_JWT_EXPIRATION_MS:86400000}


# =========================================================
# OPENFEIGN
# =========================================================

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:10000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:30000}
spring.cloud.openfeign.client.config.default.logger-level=${FEIGN_LOGGER_LEVEL:basic}


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.defaultModelsExpandDepth=-1


# =========================================================
# JACKSON
# =========================================================

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata


# =========================================================
# APPLICATION TIME ZONE
# =========================================================

app.time-zone=Asia/Kolkata


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true


# =========================================================
# SERVER / PROXY
# =========================================================

server.forward-headers-strategy=framework


# =========================================================
# SECURITY
# =========================================================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# =========================================================
# LOGGING
# =========================================================

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# =========================================================
# COMMON MAIL / SMTP CONFIGURATION
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# USER MANAGEMENT - FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:600MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:610MB}
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3


# =========================================================
# AWS S3
# =========================================================

aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY:localstack}
aws.secret-key=${AWS_SECRET_KEY:localstack}
aws.s3.bucket=${S3_BUCKET:elms-content-bucket}


# =========================================================
# USER MANAGEMENT - CORS
# =========================================================

security.allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}


# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

app.oauth.google.allowed-redirect-uris=${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:3000/auth/google/callback,http://127.0.0.1:3000/auth/google/callback,http://localhost:8080/login/oauth2/code/google,http://localhost:8080/swagger-ui/oauth2-redirect.html}


