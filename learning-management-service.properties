# ===== APPLICATION =====
spring.application.name=learning-management-service
server.port=8082

# ===== EUREKA =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ===== KAFKA =====
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ===== JWT =====
app.jwt.secret=${ENROLLMENT_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===== AWS S3 =====
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY:localstack}
aws.secret-key=${AWS_SECRET_KEY:localstack}
aws.s3.bucket=${S3_BUCKET:elms-content-bucket}

# ===== FILE UPLOAD =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=610MB

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# ===== SWAGGER =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== RESILIENCE4J =====
resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=1000ms

resilience4j.retry.instances.s3Service.maxAttempts=2
resilience4j.retry.instances.s3Service.waitDuration=500ms

resilience4j.circuitbreaker.instances.analyticsService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.analyticsService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.analyticsService.waitDurationInOpenState=30s

# ===== LOGGING =====
logging.level.com.enterprise.lms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
