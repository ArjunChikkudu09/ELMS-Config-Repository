# =========================================================
# ELMS - DEVELOPMENT PROPERTIES
# =========================================================

# =========================================================
# JPA
# =========================================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# SWAGGER / API DOCUMENTATION
# =========================================================

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# =========================================================
# LOGGING
# =========================================================

logging.level.com.enterprise.lms=DEBUG
logging.level.com.lms.assessment=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=INFO


# =========================================================
# REDIS
# =========================================================

# Redis is disabled for local development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=none


# =========================================================
# ASSESSMENT CORS
# =========================================================

assessment.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
