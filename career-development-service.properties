# =========================================================
# SERVER CONFIGURATION
# =========================================================

server.port=8084


# =========================================================
# EUREKA SERVICE DISCOVERY
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================================================
# DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/career_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# FLYWAY DATABASE MIGRATION
# =========================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# =========================================================
# REDIS CONFIGURATION
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# =========================================================
# SWAGGER / OPENAPI CONFIGURATION
# =========================================================

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# =========================================================
# API GATEWAY / PROXY CONFIGURATION
# =========================================================

server.forward-headers-strategy=framework


# =========================================================
# JDOODLE COMPILER API
# =========================================================

jdoodle.api-url=https://api.jdoodle.com/v1/execute
jdoodle.client-id=${JDOODLE_CLIENT_ID}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET}
