# ===== DEV OVERRIDES =====

# ===== DATASOURCE =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== SWAGGER =====
springdoc.swagger-ui.enabled=true

# ===== LOGGING =====
logging.level.com.enterprise.lms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== REDIS =====
# Redis is disabled for local development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=none
