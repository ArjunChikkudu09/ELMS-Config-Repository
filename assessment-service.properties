# =====================================================
# ASSESSMENT SERVICE
# =====================================================

spring.application.name=assessment-service
server.port=8083
server.shutdown=graceful


# =====================================================
# EUREKA
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =====================================================
# DATASOURCE
# =====================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:assessment_db}?useSSL=${DB_SSL:false}&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=AssessmentHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# =====================================================
# REDIS
# =====================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.cache.type=redis


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true


# =====================================================
# ACTUATOR / METRICS
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

management.metrics.tags.application=assessment-service
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:dev}


# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.defaultModelsExpandDepth=-1


# =====================================================
# RESILIENCE4J
# =====================================================

resilience4j.circuitbreaker.instances.userManagementService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userManagementService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userManagementService.slow-call-duration-threshold=2000ms
resilience4j.circuitbreaker.instances.userManagementService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.userManagementService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userManagementService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userManagementService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.learningManagementService.sliding-window-size=10
resilience4j.circuitbreaker.instances.learningManagementService.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.learningManagementService.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.learningManagementService.permitted-number-of-calls-in-half-open-state=5


# =====================================================
# USER MANAGEMENT INTEGRATION
# =====================================================

assessment.integration.user-management.base-url=${USER_MGMT_BASE_URL:http://localhost:8081}
assessment.integration.user-management.connect-timeout=5s
assessment.integration.user-management.read-timeout=10s


# =====================================================
# LEARNING MANAGEMENT / ENROLLMENT INTEGRATION
# =====================================================

assessment.integration.learning-management.base-url=${LEARNING_MGMT_BASE_URL:http://localhost:8082}
assessment.integration.learning-management.connect-timeout=5s
assessment.integration.learning-management.read-timeout=10s


# =====================================================
# ASSESSMENT CACHE
# =====================================================

assessment.cache.ttl.quiz-detail-seconds=7200
assessment.cache.ttl.quiz-list-seconds=900
assessment.cache.ttl.attempt-session-buffer-seconds=600
assessment.cache.ttl.result-seconds=14400
assessment.cache.ttl.jwks-seconds=86400
assessment.cache.ttl.enrollment-seconds=1800


# =====================================================
# SCHEDULER
# =====================================================

assessment.scheduler.expiry-cron=0 * * * * *


# =====================================================
# CORS
# =====================================================

assessment.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080


# =====================================================
# JWT / USER MANAGEMENT JWKS
# =====================================================

jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
