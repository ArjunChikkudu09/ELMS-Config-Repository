# =========================================================
# APPLICATION
# =========================================================

spring.application.name=attendance-service

server.port=8086


# =========================================================
# EUREKA CLIENT
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:h2:mem:elms_attendance_test;MODE=MySQL;DB_CLOSE_DELAY=-1

spring.datasource.username=root

spring.datasource.password=${ATTENDANCE_DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.show-sql=false


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true


# =========================================================
# REDIS
# =========================================================

spring.data.redis.repositories.enabled=false


# =========================================================
# SECURITY / JWT
# =========================================================

attendance.security.enabled=true

attendance.security.jwt.base64=false

attendance.security.jwt.secret=${ATTENDANCE_JWT_SECRET}

attendance.security.jwt.issuer=


# =========================================================
# ENROLLMENT SERVICE INTERNAL JWT
# =========================================================

attendance.integration.enrollment-jwt-secret=${ENROLLMENT_JWT_SECRET}

attendance.integration.enrollment-jwt-expiration-ms=3600000


# =========================================================
# OPENFEIGN
# =========================================================

spring.cloud.openfeign.client.config.default.connect-timeout=5000

spring.cloud.openfeign.client.config.default.read-timeout=10000

spring.cloud.openfeign.client.config.default.logger-level=basic


# =========================================================
# TIME ZONE
# =========================================================

attendance.time-zone=Asia/Kolkata


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always


# =========================================================
# SECURITY
# =========================================================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
