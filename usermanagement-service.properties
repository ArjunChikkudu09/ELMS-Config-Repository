# =========================================================
# USER MANAGEMENT SERVICE
# =========================================================

spring.application.name=user-management-service
server.port=8081
server.servlet.context-path=/

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_userservice_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# HIKARI
# =========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:CHANGE_ME}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# =========================================================
# MAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:CHANGE_ME}
spring.mail.password=${MAIL_PASSWORD:CHANGE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=uploads/

# =========================================================
# SWAGGER
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.com.lms.usermanagementservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =========================================================
# JACKSON
# =========================================================

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}

# =========================================================
# CACHE
# =========================================================

spring.cache.type=none

# =========================================================
# SECURITY
# =========================================================

security.allowed.origins=http://localhost:3000

# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:CHANGE_ME}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:CHANGE_ME}
spring.security.oauth2.client.registration.google.scope=email,profile

app.oauth.google.redirect-uri=http://localhost:3000/auth/google/callback
app.oauth.google.allowed-redirect-uris=${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:3000/auth/google/callback,http://127.0.0.1:3000/auth/google/callback,http://localhost:8080/login/oauth2/code/google,http://localhost:8080/swagger-ui/oauth2-redirect.html}

# =========================================================
# GITHUB OAUTH2
# =========================================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

# =========================================================
# MICROSOFT OAUTH2
# =========================================================

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:YOUR_MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:YOUR_MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.provider=microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# =========================================================
# DEVTOOLS
# =========================================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
